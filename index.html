<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Preconnect to font origins FIRST (before anything else) ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- ── Async font load — does NOT block rendering ── -->
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=optional"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=optional"
        rel="stylesheet"
      />
    </noscript>

    <!-- ── Favicon (static — same on every page) ── -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#060810" />
    <meta name="author" content="FreeReelsDownloader" />

    <!-- ── Fallback title — react-helmet overrides this on every page ── -->
    <title>FreeReelsDownloader — Download Instagram Reels &amp; YouTube Videos Free</title>

    <!--
      ════════════════════════════════════════════════════════════════
      IMPORTANT: All per-page tags are set via react-helmet in each
      page component. Do NOT add them here — duplicates break SEO.

      Each page component must include via <Helmet>:
        - <title>
        - <meta name="description">
        - <meta name="keywords">
        - <meta name="robots">
        - <link rel="canonical">
        - <meta property="og:title">
        - <meta property="og:description">
        - <meta property="og:url">
        - <meta property="og:image">
        - <meta property="og:type">
        - <meta property="og:site_name">
        - <meta name="twitter:card">
        - <meta name="twitter:title">
        - <meta name="twitter:description">
        - <meta name="twitter:image">
        - <script type="application/ld+json"> (schema)
      ════════════════════════════════════════════════════════════════
    -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
